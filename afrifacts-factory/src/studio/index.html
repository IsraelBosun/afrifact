<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AfriFacts Review Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --paper:      #F7F4EE;
    --card:       #FFFFFF;
    --ink:        #1B1815;
    --ink-soft:   #6A625A;
    --ink-faint:  #9A9086;
    --rule:       #E2DCD1;
    --rule-firm:  #CFC7B9;

    --brand:      #1D9E75;
    --error:      #A32B1C;
    --error-bg:   #FBEAE7;
    --warn:       #855207;
    --warn-bg:    #FBF0DC;
    --ok:         #0F6E56;
    --ok-bg:      #E3F4EE;

    --history:  #993C1D;
    --culture:  #0F6E56;
    --business: #534AB7;
    --food:     #993556;
    --sports:   #185FA5;

    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:  'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono:  'IBM Plex Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:     #14120F;
      --card:      #1D1A16;
      --ink:       #F0EBE3;
      --ink-soft:  #A79E92;
      --ink-faint: #6F675C;
      --rule:      #2E2A24;
      --rule-firm: #454037;

      --error:    #F0917F;
      --error-bg: #3A1A14;
      --warn:     #E5B463;
      --warn-bg:  #362513;
      --ok:       #6FD6B4;
      --ok-bg:    #10322A;

      --history:  #E09A7C;
      --culture:  #6FD6B4;
      --business: #A8A1EE;
      --food:     #E79BB4;
      --sports:   #8FBEEC;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 940px; margin: 0 auto; padding: 0 24px 96px; }

  /* ---- masthead ---------------------------------------------------- */

  header.masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 20px;
    padding: 40px 0 20px;
    border-bottom: 2px solid var(--ink);
  }
  .wordmark {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .wordmark em { font-style: normal; color: var(--brand); }
  .masthead .tagline {
    color: var(--ink-soft);
    font-size: 13px;
    margin-right: auto;
  }

  /* Counters read as a ledger line, not as dashboard cards. */
  .tally { display: flex; gap: 22px; font-family: var(--mono); font-size: 12px; }
  .tally div { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .tally b {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .tally span { color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
  .tally .live b   { color: var(--ok); }
  .tally .block b  { color: var(--error); }

  /* ---- filter bar --------------------------------------------------- */

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 18px 0 26px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 28px;
  }
  .filters button {
    font: inherit;
    font-size: 13px;
    padding: 5px 13px;
    border-radius: 999px;
    border: 1px solid var(--rule-firm);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .filters button:hover { border-color: var(--ink-faint); color: var(--ink); }
  .filters button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .filters button:focus-visible,
  .row-head:focus-visible,
  .act:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  /* ---- fact rows ---------------------------------------------------- */

  .facts { display: flex; flex-direction: column; gap: 14px; }

  article.fact {
    background: var(--card);
    border: 1px solid var(--rule);
    /* The category stripe is the one strong hue on a row. */
    border-left: 3px solid var(--cat, var(--rule-firm));
    border-radius: 3px;
  }

  .row-head {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 18px;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 18px 20px;
    cursor: pointer;
  }
  .row-head:hover { background: color-mix(in srgb, var(--cat) 4%, transparent); }

  .eyebrow {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }
  .eyebrow .cat {
    color: var(--cat);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  .claim {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.4;
    margin: 0;
    text-wrap: pretty;
  }

  /* Status and blockers stack on the right, so a scan down the page
     answers "what needs me" without opening anything. */
  .row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }

  .pill {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 3px 9px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .pill.approved   { background: var(--ok-bg);    color: var(--ok); }
  .pill.draft      { background: transparent;     color: var(--ink-faint); border: 1px solid var(--rule-firm); }
  .pill.rejected   { background: var(--error-bg); color: var(--error); }
  .pill.needs-work { background: var(--warn-bg);  color: var(--warn); }
  .pill.blockers   { background: var(--error-bg); color: var(--error); }
  .pill.soft       { background: var(--warn-bg);  color: var(--warn); }
  .pill.ready      { background: var(--ok-bg);    color: var(--ok); }

  /* ---- detail ------------------------------------------------------- */

  .detail { border-top: 1px solid var(--rule); padding: 4px 20px 22px; }
  .detail[hidden] { display: none; }

  .detail h3 {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.11em;
    color: var(--ink-faint);
    margin: 24px 0 10px;
  }

  .problem {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 10px;
    padding: 9px 12px;
    border-radius: 3px;
    margin-bottom: 6px;
    font-size: 13.5px;
  }
  .problem.error   { background: var(--error-bg); }
  .problem.warning { background: var(--warn-bg); }
  .problem .mark { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
  .problem.error   .mark { color: var(--error); }
  .problem.warning .mark { color: var(--warn); }
  .problem .field { grid-column: 2; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .problem .msg   { grid-column: 2; }

  .source {
    border-top: 1px solid var(--rule);
    padding: 14px 0;
  }
  .source:first-of-type { border-top: 0; }
  .source .cite { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 4px; }
  .source .cite b { color: var(--ink); font-weight: 600; }
  .tier {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-faint);
    border: 1px solid var(--rule-firm);
    border-radius: 2px;
    padding: 1px 6px;
    margin-left: 6px;
  }

  /* The passage is the highest-value field in the schema, so it gets the
     strongest visual treatment on the page. */
  blockquote.passage {
    margin: 10px 0 0;
    padding: 12px 16px;
    border-left: 2px solid var(--rule-firm);
    background: var(--paper);
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.6;
  }
  blockquote.passage.missing {
    border-left-color: var(--error);
    background: var(--error-bg);
    color: var(--error);
    font-family: var(--sans);
    font-size: 13.5px;
  }
  blockquote.passage.missing::before {
    content: 'No passage yet — ';
    font-weight: 600;
  }

  .locator {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin-top: 9px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }
  .locator span b { color: var(--ink-faint); font-weight: 400; }
  .locator a { color: var(--brand); }

  /* Surprise scores as filled pips: a low axis is visible without reading. */
  .axes { display: flex; flex-direction: column; gap: 7px; }
  .axis { display: grid; grid-template-columns: 118px auto 1fr; align-items: center; gap: 12px; }
  .axis .name { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .pips { display: flex; gap: 3px; }
  .pip { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--rule-firm); }
  .pip.on { background: var(--ink); border-color: var(--ink); }
  .axis.under .pip.on { background: var(--error); border-color: var(--error); }
  .axis .verdict { font-size: 12px; color: var(--error); }

  .body-para { margin: 0 0 10px; font-size: 14px; color: var(--ink-soft); }
  .why {
    border-left: 2px solid var(--cat, var(--brand));
    padding: 10px 0 10px 14px;
    font-size: 14px;
  }

  /* ---- decision ----------------------------------------------------- */

  .decision {
    margin-top: 26px;
    padding: 18px 20px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
  }
  .field-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .field-row label { display: flex; flex-direction: column; gap: 5px; flex: 1 1 200px; }
  .field-row span {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-faint);
  }
  input, textarea {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule-firm);
    border-radius: 3px;
    padding: 8px 10px;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 62px; }

  .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .act {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 3px;
    border: 1px solid var(--rule-firm);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .act:hover:not(:disabled) { border-color: var(--ink-faint); }
  .act.approve { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }
  .act.approve:hover:not(:disabled) { filter: brightness(1.08); }
  .act:disabled { opacity: 0.42; cursor: not-allowed; }

  .why-blocked {
    font-size: 12.5px;
    color: var(--error);
    margin: 10px 0 0;
  }
  .saved-note { font-size: 12.5px; color: var(--ink-faint); margin: 10px 0 0; }

  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--ink-faint);
  }
  .empty p { max-width: 42ch; margin: 0 auto 8px; }

  footer.foot {
    margin-top: 40px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
  }

  @media (max-width: 620px) {
    .row-head { grid-template-columns: 1fr; }
    .row-side { flex-direction: row; align-items: center; flex-wrap: wrap; }
    .axis { grid-template-columns: 100px auto; }
    .axis .verdict { grid-column: 2; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <h1 class="wordmark">Afri<em>Facts</em></h1>
    <p class="tagline">Review studio</p>
    <div class="tally" id="tally"></div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter facts"></nav>

  <main class="facts" id="facts"></main>

  <footer class="foot" id="foot"></footer>
</div>

<script>
(() => {
  'use strict';

  const CATEGORY_VAR = {
    History: 'var(--history)',
    Culture: 'var(--culture)',
    Business: 'var(--business)',
    Food: 'var(--food)',
    Sports: 'var(--sports)',
  };

  const FILTERS = [
    { id: 'needs-me', label: 'Needs me' },
    { id: 'all', label: 'All' },
    { id: 'blocked', label: 'Blocked' },
    { id: 'ready', label: 'Ready to approve' },
    { id: 'approved', label: 'Approved' },
  ];

  const state = { facts: [], reviewsPath: '', filter: 'needs-me', open: new Set(), reviewer: '' };

  try {
    state.reviewer = localStorage.getItem('afrifacts.reviewer') || '';
  } catch (_) { /* private window, or site data blocked */ }

  const el = (tag, props, kids) => {
    const node = Object.assign(document.createElement(tag), props || {});
    for (const kid of [].concat(kids || [])) {
      if (kid === null || kid === undefined) continue;
      node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return node;
  };

  const passes = (f, filter) => {
    switch (filter) {
      case 'all': return true;
      case 'blocked': return f.errors.length > 0;
      case 'ready': return f.clean && f.status !== 'approved';
      case 'approved': return f.status === 'approved';
      // "Needs me" is the default because a review queue should open on
      // work, not on everything ever written.
      default: return f.status !== 'approved' && f.status !== 'rejected';
    }
  };

  function renderTally() {
    const f = state.facts;
    const counts = [
      { cls: '', n: f.length, label: 'in corpus' },
      { cls: 'live', n: f.filter((x) => x.status === 'approved' && x.clean).length, label: 'publishable' },
      { cls: 'block', n: f.filter((x) => x.errors.length > 0).length, label: 'blocked' },
    ];
    document.getElementById('tally').replaceChildren(...counts.map((c) =>
      el('div', { className: c.cls }, [el('b', null, c.n), el('span', null, c.label)])
    ));
  }

  function renderFilters() {
    const nav = document.getElementById('filters');
    nav.replaceChildren(...FILTERS.map((f) => {
      const n = state.facts.filter((x) => passes(x, f.id)).length;
      const btn = el('button', { type: 'button', textContent: f.label + ' · ' + n });
      btn.setAttribute('aria-pressed', String(state.filter === f.id));
      btn.addEventListener('click', () => { state.filter = f.id; render(); });
      return btn;
    }));
  }

  function problemNode(p) {
    return el('div', { className: 'problem ' + p.level }, [
      el('span', { className: 'mark', textContent: p.level === 'error' ? 'BLOCKS' : 'CHECK' }),
      el('span', { className: 'field', textContent: p.field }),
      el('span', { className: 'msg', textContent: p.message }),
    ]);
  }

  function sourceNode(s) {
    const locator = el('div', { className: 'locator' });
    for (const entry of Object.entries(s.locator)) {
      const key = entry[0];
      const value = entry[1];
      const label = el('b', { textContent: key + ' ' });
      if (key === 'url') {
        locator.append(el('span', null, [
          label,
          el('a', { href: value, target: '_blank', rel: 'noreferrer noopener', textContent: 'open' }),
        ]));
      } else {
        locator.append(el('span', null, [label, value]));
      }
    }

    const quote = el('blockquote', {
      className: 'passage' + (s.passageMissing ? ' missing' : ''),
      textContent: s.passageMissing
        ? 'open the source, copy the exact sentence the fact came from, and paste it into the corpus file.'
        : s.passage,
    });

    return el('div', { className: 'source' }, [
      el('p', { className: 'cite' }, [
        el('b', { textContent: s.shortName }),
        el('span', { className: 'tier', textContent: s.tier }),
      ]),
      el('p', { className: 'cite', textContent: s.citation }),
      quote,
      locator,
      s.note ? el('p', { className: 'cite', style: 'margin-top:9px', textContent: 'Note — ' + s.note }) : null,
    ]);
  }

  function axisNode(name, score) {
    const under = score < 3;
    const pips = el('div', { className: 'pips' });
    for (let i = 1; i <= 5; i += 1) {
      pips.append(el('span', { className: 'pip' + (i <= score ? ' on' : '') }));
    }
    return el('div', { className: 'axis' + (under ? ' under' : '') }, [
      el('span', { className: 'name', textContent: name }),
      pips,
      under ? el('span', { className: 'verdict', textContent: 'below the bar of 3' }) : el('span'),
    ]);
  }

  function decisionNode(f) {
    const nameInput = el('input', { type: 'text', value: state.reviewer, placeholder: 'your name' });
    const noteInput = el('textarea', { value: f.notes, placeholder: 'why rejected, or what still needs work' });

    const status = el('p', { className: 'saved-note' });
    if (f.reviewedAt) {
      status.textContent = 'Last decision: ' + f.status
        + (f.reviewer ? ' by ' + f.reviewer : '') + ' on ' + f.reviewedAt;
    }

    const send = async (next) => {
      const reviewer = nameInput.value.trim();
      state.reviewer = reviewer;
      try { localStorage.setItem('afrifacts.reviewer', reviewer); } catch (_) { /* ignore */ }

      status.textContent = 'Saving…';
      try {
        const res = await fetch('/api/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ factId: f.id, status: next, reviewer: reviewer, notes: noteInput.value }),
        });
        const payload = await res.json();
        if (!res.ok) { status.textContent = payload.error || 'Could not save.'; return; }
        state.facts = payload.facts;
        state.reviewsPath = payload.reviewsPath;
        state.open.add(f.id);
        render();
      } catch (err) {
        status.textContent = 'Could not save: ' + err;
      }
    };

    const approve = el('button', { className: 'act approve', type: 'button', textContent: 'Approve' });
    approve.disabled = !f.clean;
    approve.addEventListener('click', () => send('approved'));

    const needsWork = el('button', { className: 'act', type: 'button', textContent: 'Needs work' });
    needsWork.addEventListener('click', () => send('needs-work'));

    const reject = el('button', { className: 'act', type: 'button', textContent: 'Reject' });
    reject.addEventListener('click', () => send('rejected'));

    const blocked = f.clean ? null : el('p', {
      className: 'why-blocked',
      textContent: 'Approval is off until the ' + f.errors.length + ' blocking problem'
        + (f.errors.length === 1 ? ' is' : 's are') + ' fixed in the corpus file.',
    });

    return el('div', { className: 'decision' }, [
      el('div', { className: 'field-row' }, [
        el('label', null, [el('span', { textContent: 'Reviewer' }), nameInput]),
      ]),
      el('div', { className: 'field-row' }, [
        el('label', null, [el('span', { textContent: 'Note' }), noteInput]),
      ]),
      el('div', { className: 'acts' }, [approve, needsWork, reject]),
      blocked,
      status,
    ]);
  }

  function factNode(f) {
    const open = state.open.has(f.id);
    const article = el('article', { className: 'fact' });
    article.style.setProperty('--cat', CATEGORY_VAR[f.category] || 'var(--rule-firm)');

    const side = el('div', { className: 'row-side' }, [
      el('span', { className: 'pill ' + f.status, textContent: f.status }),
      f.errors.length
        ? el('span', { className: 'pill blockers', textContent: f.errors.length + ' blocking' })
        : (f.status !== 'approved' ? el('span', { className: 'pill ready', textContent: 'ready' }) : null),
      f.warnings.length
        ? el('span', { className: 'pill soft', textContent: f.warnings.length + ' to check' })
        : null,
    ]);

    const head = el('button', { className: 'row-head', type: 'button' }, [
      el('div', { className: 'eyebrow' }, [
        el('span', { className: 'cat', textContent: f.category }),
        el('span', { textContent: f.id }),
        el('span', { textContent: f.country }),
        el('span', { textContent: '#' + f.factNumber }),
      ]),
      el('p', { className: 'claim', textContent: f.fact }),
      side,
    ]);
    head.setAttribute('aria-expanded', String(open));
    head.addEventListener('click', () => {
      if (state.open.has(f.id)) state.open.delete(f.id); else state.open.add(f.id);
      render();
    });

    const detail = el('div', { className: 'detail' });
    detail.hidden = !open;

    if (open) {
      if (f.errors.length || f.warnings.length) {
        detail.append(el('h3', { textContent: 'What the validator says' }));
        for (const p of f.errors.concat(f.warnings)) detail.append(problemNode(p));
      }

      detail.append(el('h3', {
        textContent: 'Evidence · ' + f.sources.length + ' source' + (f.sources.length === 1 ? '' : 's'),
      }));
      for (const s of f.sources) detail.append(sourceNode(s));

      detail.append(el('h3', { textContent: 'Surprise' }));
      detail.append(el('div', { className: 'axes' }, [
        axisNode('prior probability', f.surprise.priorProbability),
        axisNode('specificity', f.surprise.specificity),
        axisNode('explicability', f.surprise.explicability),
      ]));

      detail.append(el('h3', { textContent: 'Deep dive' }));
      for (const para of f.deepDive.body) {
        detail.append(el('p', { className: 'body-para', textContent: para }));
      }
      detail.append(el('div', { className: 'why', textContent: f.deepDive.whyItMatters }));

      detail.append(el('h3', { textContent: 'Decay' }));
      detail.append(el('p', {
        className: 'body-para',
        textContent: f.decay.kind === 'volatile'
          ? 'Volatile — check again by ' + (f.decay.reviewBy || '(no date set)')
          : 'Permanent — settled history, no recheck needed.',
      }));

      detail.append(decisionNode(f));
    }

    article.append(head, detail);
    return article;
  }

  function render() {
    renderTally();
    renderFilters();

    const shown = state.facts.filter((f) => passes(f, state.filter));
    const main = document.getElementById('facts');

    if (state.facts.length === 0) {
      main.replaceChildren(el('div', { className: 'empty' }, [
        el('p', { textContent: 'The corpus is empty.' }),
        el('p', { textContent: 'Facts are written in src/corpus/*.ts. They appear here as soon as they exist.' }),
      ]));
    } else if (shown.length === 0) {
      main.replaceChildren(el('div', { className: 'empty' }, [
        el('p', { textContent: 'Nothing in this filter.' }),
      ]));
    } else {
      main.replaceChildren(...shown.map(factNode));
    }

    document.getElementById('foot').replaceChildren(
      el('span', { textContent: 'decisions saved to reviews.json' }),
      el('span', { textContent: 'facts are edited in src/corpus/*.ts' }),
      el('span', { textContent: 'npm run check validates the same rules' })
    );
  }

  async function load() {
    try {
      const res = await fetch('/api/facts');
      const payload = await res.json();
      state.facts = payload.facts;
      state.reviewsPath = payload.reviewsPath;
      render();
    } catch (err) {
      document.getElementById('facts').replaceChildren(
        el('div', { className: 'empty' }, [
          el('p', { textContent: 'Could not reach the server: ' + err }),
        ])
      );
    }
  }

  load();
})();
</script>
</body>
</html>
